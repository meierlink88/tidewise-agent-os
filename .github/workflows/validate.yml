name: Validate

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentos_test
          POSTGRES_PASSWORD: agentos_test
          POSTGRES_DB: agentos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentos_test -d agentos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://agentos_test:agentos_test@127.0.0.1:5432/agentos_test
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project with dev dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -e .[dev]

      - name: Format with ruff
        run: uv run ruff format --check .

      - name: Validate (lint + type)
        run: uv run bash scripts/validate.sh

      - name: Run unit tests
        run: uv run python -m unittest

      - name: Validate UAT deployment contracts
        run: |
          bash -n infra/uat/bootstrap-dgx.sh infra/uat/preflight.sh infra/uat/deploy-dependencies.sh infra/uat/deploy.sh infra/uat/collect-diagnostics.sh
          python -c 'import pathlib, yaml; yaml.safe_load(pathlib.Path(".github/workflows/deploy-uat.yml").read_text())'
          docker compose --env-file infra/uat/.env.example -f infra/uat/docker-compose.yaml config --quiet
          test "$(docker compose --env-file infra/uat/.env.example -f infra/uat/docker-compose.yaml config --format json | jq -r '.services.agentos.ports[0].host_ip')" = 127.0.0.1
          test "$(docker compose --env-file infra/uat/.env.example -f infra/uat/docker-compose.yaml config --format json | jq -r '.services.postgres.ports // empty')" = ""
          test "$(docker compose --env-file infra/uat/.env.example -f infra/uat/docker-compose.yaml config --format json | jq -r '.services.neo4j.ports // empty')" = ""
          grep -Fq 'capture_candidate_diagnostics' infra/uat/deploy.sh
          grep -Fq 'python -m scripts.migrate_agno_db' infra/uat/deploy.sh
          grep -Fq 'x-tidewise-release' infra/uat/deploy.sh
          test -x infra/uat/preflight.sh
          test -x infra/uat/deploy-dependencies.sh
          test -x infra/uat/deploy.sh
          test -x infra/uat/collect-diagnostics.sh

      - name: Build the immutable runtime image
        run: docker build -t tidewise-agent-os:ci .
