name: Deploy UAT

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Optional full commit SHA from main; defaults to latest main.
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: agentos-uat-deploy
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Validate release commit
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
      - name: Checkout main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate commit
        id: release
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Deploy UAT must be dispatched from the main workflow ref" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          target="${REQUESTED_SHA:-}"
          if [ -z "$target" ]; then
            target="$(git rev-parse origin/main)"
          fi
          if ! [[ "$target" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character Git commit SHA" >&2
            exit 1
          fi
          git cat-file -e "${target}^{commit}"
          if ! git merge-base --is-ancestor "$target" origin/main; then
            echo "Release commit is not part of main: $target" >&2
            exit 1
          fi
          echo "commit_sha=$(git rev-parse "$target")" >> "$GITHUB_OUTPUT"

      - name: Require successful validation for the commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA: ${{ steps.release.outputs.commit_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'validate.yml',
              head_sha: process.env.TARGET_SHA,
              status: 'completed',
              per_page: 100,
            });
            const succeeded = response.data.workflow_runs.some(
              (run) => run.head_sha === process.env.TARGET_SHA && run.conclusion === 'success',
            );
            if (!succeeded) {
              core.setFailed(`No successful Validate run exists for ${process.env.TARGET_SHA}`);
            }

  build-and-push:
    name: Build and publish SWR images
    runs-on: ubuntu-latest
    needs: resolve-release
    environment: uat
    outputs:
      agentos_image: ${{ steps.refs.outputs.agentos_image }}
      deploy_bundle_image: ${{ steps.refs.outputs.deploy_bundle_image }}
    env:
      SWR_REGISTRY: ${{ vars.SWR_REGISTRY }}
      SWR_NAMESPACE: ${{ vars.SWR_NAMESPACE }}
      SWR_AGENTOS_REPOSITORY: ${{ vars.SWR_AGENTOS_REPOSITORY }}
      SWR_DEPLOY_REPOSITORY: ${{ vars.SWR_AGENTOS_DEPLOY_REPOSITORY }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.commit_sha }}

      - name: Resolve image tags
        id: tags
        env:
          COMMIT_SHA: ${{ needs.resolve-release.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SWR_REGISTRY:?Set SWR_REGISTRY in the uat Environment}"
          : "${SWR_NAMESPACE:?Set SWR_NAMESPACE in the uat Environment}"
          : "${SWR_AGENTOS_REPOSITORY:?Set SWR_AGENTOS_REPOSITORY in the uat Environment}"
          : "${SWR_DEPLOY_REPOSITORY:?Set SWR_AGENTOS_DEPLOY_REPOSITORY in the uat Environment}"
          prefix="${SWR_REGISTRY}/${SWR_NAMESPACE}"
          echo "agentos_tag=${prefix}/${SWR_AGENTOS_REPOSITORY}:${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "deploy_bundle_tag=${prefix}/${SWR_DEPLOY_REPOSITORY}:${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to SWR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build and push AgentOS
        id: agentos
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.agentos_tag }}
          labels: org.opencontainers.image.revision=${{ needs.resolve-release.outputs.commit_sha }}

      - name: Build and push immutable deployment bundle
        id: bundle
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: infra/uat
          file: infra/uat/deploy-bundle.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.deploy_bundle_tag }}
          labels: org.opencontainers.image.revision=${{ needs.resolve-release.outputs.commit_sha }}

      - name: Resolve immutable image references
        id: refs
        env:
          AGENTOS_TAG: ${{ steps.tags.outputs.agentos_tag }}
          AGENTOS_DIGEST: ${{ steps.agentos.outputs.digest }}
          BUNDLE_TAG: ${{ steps.tags.outputs.deploy_bundle_tag }}
          BUNDLE_DIGEST: ${{ steps.bundle.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          for digest in "$AGENTOS_DIGEST" "$BUNDLE_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "invalid image digest" >&2; exit 1; }
          done
          echo "agentos_image=${AGENTOS_TAG}@${AGENTOS_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "deploy_bundle_image=${BUNDLE_TAG}@${BUNDLE_DIGEST}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to UAT ECS
    runs-on: [self-hosted, linux, x64, tidewise-agentos-uat-ecs]
    needs: [resolve-release, build-and-push]
    environment: uat
    env:
      DEPLOY_ROOT: /opt/tidewise/agentos-uat
      SWR_REGISTRY: ${{ vars.SWR_REGISTRY }}
      UAT_RUNNER_NAME: ${{ vars.UAT_AGENTOS_RUNNER_NAME }}
      AGENTOS_EXTERNAL_URL: ${{ vars.AGENTOS_EXTERNAL_URL }}
      DB_HOST: ${{ vars.RDS_HOST }}
      DB_PORT: "5432"
      DB_USER: agent_os_uat_runtime
      DB_DATABASE: agent_os_uat
      DB_SSLMODE: require
      RELEASE_SHA: ${{ needs.resolve-release.outputs.commit_sha }}
      AGENTOS_IMAGE: ${{ needs.build-and-push.outputs.agentos_image }}
      DEPLOY_BUNDLE_IMAGE: ${{ needs.build-and-push.outputs.deploy_bundle_image }}
      DB_PASS: ${{ secrets.AGENTOS_DB_PASSWORD }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DATA_SERVICE_TOKEN: ${{ secrets.DATA_SERVICE_TOKEN }}
      PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BOCHA_API_KEY: ${{ secrets.BOCHA_API_KEY }}
      MCP_CONNECT_SECRET: ${{ secrets.MCP_CONNECT_SECRET }}
      AGENTOS_MCP_SIGNING_KEY: ${{ secrets.AGENTOS_MCP_SIGNING_KEY }}
      JWT_JWKS_BASE64: ${{ secrets.JWT_JWKS_BASE64 }}
    steps:
      - name: Login to SWR with pull credentials
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_PULL_USERNAME }}
          password: ${{ secrets.SWR_PULL_PASSWORD }}

      - name: Pull immutable deployment bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_BUNDLE_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "bundle must use a digest" >&2; exit 1; }
          docker pull "$DEPLOY_BUNDLE_IMAGE"
          bundle_root="${RUNNER_TEMP}/agentos-uat-bundle-${GITHUB_RUN_ID}"
          rm -rf "$bundle_root"
          mkdir -p "$bundle_root"
          container="$(docker create "$DEPLOY_BUNDLE_IMAGE")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "${container}:/bundle/." "$bundle_root"
          docker rm -f "$container" >/dev/null
          trap - EXIT
          echo "root=$bundle_root" >> "$GITHUB_OUTPUT"
          echo "compose=$bundle_root/docker-compose.yaml" >> "$GITHUB_OUTPUT"

      - name: Prepare protected runtime inputs
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_env="${RUNNER_TEMP}/agentos-uat-${GITHUB_RUN_ID}.env"
          images_env="${RUNNER_TEMP}/agentos-uat-${GITHUB_RUN_ID}.images.env"
          jwks_tmp="${RUNNER_TEMP}/agentos-uat-${GITHUB_RUN_ID}.jwks.json"
          umask 077
          python3 - "$runtime_env" <<'PY'
          import os
          import pathlib
          import sys

          names = (
              "AGENTOS_EXTERNAL_URL", "DB_HOST", "DB_PORT", "DB_USER", "DB_PASS", "DB_DATABASE", "DB_SSLMODE",
              "DEEPSEEK_API_KEY", "DATA_SERVICE_TOKEN", "PARALLEL_API_KEY", "TAVILY_API_KEY", "BOCHA_API_KEY",
              "MCP_CONNECT_SECRET", "AGENTOS_MCP_SIGNING_KEY",
          )
          lines = []
          for name in names:
              value = os.environ.get(name, "")
              if "\n" in value or "\r" in value:
                  raise SystemExit(f"{name} must not contain line breaks")
              lines.append(f"{name}={value}")
          lines.extend(("AGENTOS_DATA_DIR=/opt/tidewise/agentos-uat/data", "AGENTOS_JWKS_FILE=/opt/tidewise/agentos-uat/jwt-jwks.json"))
          pathlib.Path(sys.argv[1]).write_text("\n".join(lines) + "\n")
          PY
          printf 'AGENTOS_IMAGE=%s\n' "$AGENTOS_IMAGE" > "$images_env"
          printf '%s' "$JWT_JWKS_BASE64" | base64 --decode > "$jwks_tmp"
          python3 -m json.tool "$jwks_tmp" >/dev/null
          install -m 0640 "$jwks_tmp" "${DEPLOY_ROOT}/jwt-jwks.json"
          chgrp tidewise-agentos "${DEPLOY_ROOT}/jwt-jwks.json"
          rm -f "$jwks_tmp"
          echo "runtime_env=$runtime_env" >> "$GITHUB_OUTPUT"
          echo "images_env=$images_env" >> "$GITHUB_OUTPUT"

      - name: Pull candidate image
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AGENTOS_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "AgentOS image must use a digest" >&2; exit 1; }
          docker pull "$AGENTOS_IMAGE"

      - name: Preflight ECS, RDS, network and Data Service
        shell: bash
        run: ${{ steps.bundle.outputs.root }}/preflight.sh

      - name: Validate UAT Compose
        shell: bash
        run: >-
          docker compose
          --env-file "${{ steps.runtime.outputs.runtime_env }}"
          --env-file "${{ steps.runtime.outputs.images_env }}"
          -f "${{ steps.bundle.outputs.compose }}"
          config --quiet

      - name: Deploy and verify release
        shell: bash
        env:
          RUNTIME_ENV: ${{ steps.runtime.outputs.runtime_env }}
          CANDIDATE_IMAGES: ${{ steps.runtime.outputs.images_env }}
          COMPOSE_FILE: ${{ steps.bundle.outputs.compose }}
        run: ${{ steps.bundle.outputs.root }}/deploy.sh

      - name: Collect sanitized failure diagnostics
        id: diagnostics
        if: failure() && steps.runtime.outcome == 'success'
        shell: bash
        env:
          RUNTIME_ENV: ${{ steps.runtime.outputs.runtime_env }}
          CANDIDATE_IMAGES: ${{ steps.runtime.outputs.images_env }}
          COMPOSE_FILE: ${{ steps.bundle.outputs.compose }}
        run: |
          output="${RUNNER_TEMP}/agentos-uat-diagnostics-${GITHUB_RUN_ID}.log"
          "${{ steps.bundle.outputs.root }}/collect-diagnostics.sh" > "$output"
          echo "file=$output" >> "$GITHUB_OUTPUT"

      - name: Upload failure diagnostics
        if: failure() && steps.diagnostics.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentos-uat-diagnostics-${{ github.run_id }}
          path: ${{ steps.diagnostics.outputs.file }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary secret files
        if: always() && steps.runtime.outcome == 'success'
        shell: bash
        run: rm -f "${{ steps.runtime.outputs.runtime_env }}" "${{ steps.runtime.outputs.images_env }}" "${{ steps.diagnostics.outputs.file }}"
