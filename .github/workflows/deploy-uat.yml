name: Deploy UAT

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Optional full commit SHA from main; defaults to latest main.
        required: false
        type: string
      stage_only:
        description: Start and verify DGX internally before the public ingress cutover.
        required: false
        default: false
        type: boolean
      dependencies_only:
        description: Deploy and verify only fresh DGX PostgreSQL and Neo4j; do not start AgentOS.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: agentos-uat-deploy
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Validate release commit
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
      - name: Checkout main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate commit
        id: release
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Deploy UAT must be dispatched from the main workflow ref" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          target="${REQUESTED_SHA:-}"
          if [ -z "$target" ]; then
            target="$(git rev-parse origin/main)"
          fi
          if ! [[ "$target" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character Git commit SHA" >&2
            exit 1
          fi
          git cat-file -e "${target}^{commit}"
          if ! git merge-base --is-ancestor "$target" origin/main; then
            echo "Release commit is not part of main: $target" >&2
            exit 1
          fi
          echo "commit_sha=$(git rev-parse "$target")" >> "$GITHUB_OUTPUT"

      - name: Require successful validation for the commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA: ${{ steps.release.outputs.commit_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'validate.yml',
              head_sha: process.env.TARGET_SHA,
              status: 'completed',
              per_page: 100,
            });
            const succeeded = response.data.workflow_runs.some(
              (run) => run.head_sha === process.env.TARGET_SHA && run.conclusion === 'success',
            );
            if (!succeeded) {
              core.setFailed(`No successful Validate run exists for ${process.env.TARGET_SHA}`);
            }

  deploy:
    name: Build and deploy on UAT DGX Spark
    runs-on: [self-hosted, linux, ARM64, tidewise-agentos-uat-dgx]
    needs: resolve-release
    environment: uat
    env:
      DEPLOY_ROOT: /opt/tidewise/agentos-uat
      UAT_RUNNER_NAME: ${{ vars.UAT_AGENTOS_RUNNER_NAME }}
      AGENTOS_EXTERNAL_URL: ${{ vars.AGENTOS_EXTERNAL_URL }}
      DATA_SERVICE_BASE_URL: ${{ vars.DATA_SERVICE_BASE_URL }}
      STAGE_ONLY: ${{ inputs.stage_only }}
      RELEASE_SHA: ${{ needs.resolve-release.outputs.commit_sha }}
      AGENTOS_LOCAL_REPOSITORY: tidewise-agentos-uat
      POSTGRES_IMAGE: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
      NEO4J_IMAGE: neo4j:5.26.28-community@sha256:ff32db30b2baff97971e441b46bfd9c832c1b62c970398ef579244c06b21d357
      DB_PASS: ${{ secrets.AGENTOS_DB_PASSWORD }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DATA_SERVICE_TOKEN: ${{ secrets.DATA_SERVICE_TOKEN }}
      EVENT_EXTRACTION_BATCH_SIZE: ${{ vars.EVENT_EXTRACTION_BATCH_SIZE || '20' }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      GRAPHITI_EMBEDDING_API_KEY: ${{ secrets.GRAPHITI_EMBEDDING_API_KEY }}
      GRAPHITI_EMBEDDING_BASE_URL: ${{ vars.GRAPHITI_EMBEDDING_BASE_URL }}
      GRAPHITI_EMBEDDING_MODEL: ${{ vars.GRAPHITI_EMBEDDING_MODEL }}
      GRAPHITI_EMBEDDING_DIM: ${{ vars.GRAPHITI_EMBEDDING_DIM || '1024' }}
      MCP_CONNECT_SECRET: ${{ secrets.MCP_CONNECT_SECRET }}
      AGENTOS_MCP_SIGNING_KEY: ${{ secrets.AGENTOS_MCP_SIGNING_KEY }}
      JWT_JWKS_BASE64: ${{ secrets.JWT_JWKS_BASE64 }}
      CONTROL_PLANE_JWT_VERIFICATION_KEY: ${{ vars.CONTROL_PLANE_JWT_VERIFICATION_KEY }}
    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.commit_sha }}

      - name: Build immutable AgentOS image locally on DGX
        shell: bash
        run: |
          set -euo pipefail
          [ "$(uname -m)" = aarch64 ] || { echo "local build requires aarch64" >&2; exit 1; }
          local_tag="${AGENTOS_LOCAL_REPOSITORY}:${RELEASE_SHA}"
          docker buildx build \
            --platform linux/arm64 \
            --pull \
            --load \
            --provenance=false \
            --label "org.opencontainers.image.revision=${RELEASE_SHA}" \
            --tag "$local_tag" \
            .
          image_id="$(docker image inspect --format '{{.Id}}' "$local_tag")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "invalid local image ID" >&2; exit 1; }
          [ "$(docker image inspect --format '{{.Architecture}}' "$image_id")" = arm64 ] \
            || { echo "local AgentOS image is not arm64" >&2; exit 1; }
          [ "$(docker image inspect --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}}' "$image_id")" = "$RELEASE_SHA" ] \
            || { echo "local AgentOS image revision does not match release" >&2; exit 1; }
          echo "AGENTOS_IMAGE=$image_id" >> "$GITHUB_ENV"
          echo "PASS local-agentos-image ${RELEASE_SHA} ${image_id}"

      - name: Prepare protected runtime inputs
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_env="${RUNNER_TEMP}/agentos-uat-${GITHUB_RUN_ID}.env"
          images_env="${RUNNER_TEMP}/agentos-uat-${GITHUB_RUN_ID}.images.env"
          jwks_tmp="${RUNNER_TEMP}/agentos-uat-${GITHUB_RUN_ID}.jwks.json"
          umask 077
          printf '%s' "$CONTROL_PLANE_JWT_VERIFICATION_KEY" | openssl pkey -pubin -noout >/dev/null
          python3 - "$runtime_env" <<'PY'
          import json
          import os
          import pathlib
          import sys

          names = (
              "AGENTOS_EXTERNAL_URL", "DATA_SERVICE_BASE_URL", "RELEASE_SHA", "DB_PASS",
              "DEEPSEEK_API_KEY", "DATA_SERVICE_TOKEN", "EVENT_EXTRACTION_BATCH_SIZE",
              "NEO4J_PASSWORD",
              "GRAPHITI_EMBEDDING_API_KEY", "GRAPHITI_EMBEDDING_BASE_URL",
              "GRAPHITI_EMBEDDING_MODEL", "GRAPHITI_EMBEDDING_DIM",
              "MCP_CONNECT_SECRET", "AGENTOS_MCP_SIGNING_KEY",
          )
          lines = []
          for name in names:
              value = os.environ.get(name, "")
              if "\n" in value or "\r" in value:
                  raise SystemExit(f"{name} must not contain line breaks")
              lines.append(f"{name}={value}")
          verification_key = os.environ.get("CONTROL_PLANE_JWT_VERIFICATION_KEY", "").strip()
          if not (
              verification_key.startswith("-----BEGIN PUBLIC KEY-----\n")
              and verification_key.endswith("\n-----END PUBLIC KEY-----")
          ):
              raise SystemExit("CONTROL_PLANE_JWT_VERIFICATION_KEY must be a PEM public key")
          # Compose dotenv double-quoted values decode JSON's escaped newlines back
          # into the exact PEM expected by Agno's JWT_VERIFICATION_KEY setting.
          lines.append(f"JWT_VERIFICATION_KEY={json.dumps(verification_key)}")
          lines.extend(("AGENTOS_DATA_DIR=/opt/tidewise/agentos-uat/data", "AGENTOS_JWKS_FILE=/opt/tidewise/agentos-uat/jwt-jwks.json"))
          pathlib.Path(sys.argv[1]).write_text("\n".join(lines) + "\n")
          PY
          {
            printf 'AGENTOS_IMAGE=%s\n' "$AGENTOS_IMAGE"
            printf 'POSTGRES_IMAGE=%s\n' "$POSTGRES_IMAGE"
            printf 'NEO4J_IMAGE=%s\n' "$NEO4J_IMAGE"
          } > "$images_env"
          printf '%s' "$JWT_JWKS_BASE64" | base64 --decode > "$jwks_tmp"
          python3 -m json.tool "$jwks_tmp" >/dev/null
          install -m 0640 "$jwks_tmp" "${DEPLOY_ROOT}/jwt-jwks.json"
          chgrp tidewise-agentos "${DEPLOY_ROOT}/jwt-jwks.json"
          rm -f "$jwks_tmp"
          echo "runtime_env=$runtime_env" >> "$GITHUB_OUTPUT"
          echo "images_env=$images_env" >> "$GITHUB_OUTPUT"

      - name: Pull pinned ARM64 dependency images
        shell: bash
        run: |
          set -euo pipefail
          for image in "$POSTGRES_IMAGE" "$NEO4J_IMAGE"; do
            [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "image must use a digest" >&2; exit 1; }
            docker pull "$image"
          done

      - name: Preflight DGX, public Data Service and dedicated dependencies
        shell: bash
        run: ./infra/uat/preflight.sh

      - name: Validate UAT Compose
        shell: bash
        run: >-
          docker compose
          --env-file "${{ steps.runtime.outputs.runtime_env }}"
          --env-file "${{ steps.runtime.outputs.images_env }}"
          -f infra/uat/docker-compose.yaml
          config --quiet

      - name: Deploy and verify fresh dependencies
        if: ${{ inputs.dependencies_only }}
        shell: bash
        env:
          RUNTIME_ENV: ${{ steps.runtime.outputs.runtime_env }}
          CANDIDATE_IMAGES: ${{ steps.runtime.outputs.images_env }}
          COMPOSE_FILE: ${{ github.workspace }}/infra/uat/docker-compose.yaml
        run: ./infra/uat/deploy-dependencies.sh

      - name: Deploy and verify release
        if: ${{ ! inputs.dependencies_only }}
        shell: bash
        env:
          RUNTIME_ENV: ${{ steps.runtime.outputs.runtime_env }}
          CANDIDATE_IMAGES: ${{ steps.runtime.outputs.images_env }}
          COMPOSE_FILE: ${{ github.workspace }}/infra/uat/docker-compose.yaml
          DIAGNOSTICS_FILE: ${{ runner.temp }}/agentos-uat-diagnostics-${{ github.run_id }}.log
        run: ./infra/uat/deploy.sh

      - name: Collect sanitized failure diagnostics
        id: diagnostics
        if: failure() && steps.runtime.outcome == 'success'
        shell: bash
        env:
          RUNTIME_ENV: ${{ steps.runtime.outputs.runtime_env }}
          CANDIDATE_IMAGES: ${{ steps.runtime.outputs.images_env }}
          COMPOSE_FILE: ${{ github.workspace }}/infra/uat/docker-compose.yaml
        run: |
          output="${RUNNER_TEMP}/agentos-uat-diagnostics-${GITHUB_RUN_ID}.log"
          if [ ! -s "$output" ]; then
            ./infra/uat/collect-diagnostics.sh > "$output"
          fi
          echo "file=$output" >> "$GITHUB_OUTPUT"

      - name: Upload failure diagnostics
        if: failure() && steps.diagnostics.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentos-uat-diagnostics-${{ github.run_id }}
          path: ${{ steps.diagnostics.outputs.file }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary secret files
        if: always() && steps.runtime.outcome == 'success'
        shell: bash
        run: rm -f "${{ steps.runtime.outputs.runtime_env }}" "${{ steps.runtime.outputs.images_env }}" "${{ steps.diagnostics.outputs.file }}"
