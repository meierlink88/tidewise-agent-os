manifest:
  tidewise-assistant:
    description: "观潮家本地 AgentOS 助手，用于验证模型、会话与接口链路。"
    quick_prompts:
      - "请用一句话说明你是谁"
      - "当前本地 AgentOS 的用途是什么？"
      - "给我一个新增采集 Workflow 的实施顺序"

  title-curator:
    description: "Evidence Reviewer：逐篇阅读全文，一次完成相关性判断和 Evidence 提取；日常处理运行 Raw Collection。"
    quick_prompts:
      - "审阅给定完整文章：相关则按给定分类目录提取 Evidence，无关则跳过"

  evidence-extractor:
    description: "一次阅读完成 Raw Evidence 唯一分类、语义补充和原子 Evidence 提取；生产处理请运行 Evidence Extraction Workflow。"
    quick_prompts:
      - "从给定目录选择唯一分类并提取原子 Evidence"
      - "按最小完整业务命题提炼 Evidence 的 summary、keywords 与 semantic"
      - "提炼这篇材料的关键词和可核验证据"

  event-extractor:
    description: "按主体、现实动作、直接对象、阶段和发生时点，将同批 Atomic Evidence 提炼为单一动作 Event Candidate。"
    quick_prompts:
      - "将这批 Evidence 提炼为 Event Candidate"
      - "识别同批 Evidence 中描述同一现实动作的内容"
      - "标记不能安全提炼 Event 的 Evidence"

  event-identity:
    description: "根据冻结候选判断事件身份，并识别地缘政治、宏观经济、产业链或公司大类。"
    quick_prompts:
      - "判断这个 Event Candidate 是否为单一现实动作"
      - "根据给定历史 Event 判断是否为同一事件"
      - "根据事件本身的动作判断大类，不按下游影响归类"

  event-association:
    description: "只做语义匹配：从代码提供的权威候选目录页选择直接关联的故事线或主体。"
    quick_prompts:
      - "判断给定 Event 直接关联本页哪些故事线"
      - "检查这条公司经营事件是否真的涉及地缘政治故事线"
      - "没有直接匹配时返回明确的无匹配原因"

  event-signal-analyst:
    description: "基于未发布 Event 和已冻结分类，从给定锚点与变量提出直接 Signal；不执行写入。"
    quick_prompts:
      - "判断给定 Event 是否直接支持候选变量变化"
      - "基于给定候选身份提出直接 Signal"

  investment-reasoner:
    description: "按地缘政治、宏观经济、产业链三层复用推理，并从有效 Signal 根沿标准拓扑执行最多三跳传导。"
    quick_prompts:
      - "根据给定 Signal Fact 和拓扑推导产业链节点变化"

  investment-report-writer:
    description: "将已审核的投研结论写成固定结构、面向读者的中文报告，不改变方向、周期、置信度和依据。"
    quick_prompts:
      - "把这组已审核的投研结论写成自然中文"
      - "保持关键业务字段不变，优化报告表达"
      - "整理节点影响和传导逻辑的读者版说明"

  investment-reviewer:
    description: "审核投研结论的 Signal 根、拓扑传导、周期和证据完整性。"
    quick_prompts:
      - "审核该产业链节点结论是否可追溯至有效 Signal Fact"

  local-ping:
    description: "不调用模型的本地运行时健康检查。"
    quick_prompts:
      - "Ping"

  raw-collection:
    description: "四个 Step、一个 Loop：Evidence Collect → Prepare Evidence Review → Evidence Reviewer → Evidence Publish；发布失败记录异常，不自动补发。"
    quick_prompts:
      - "采集全球范围最新发布、可能影响中国A股板块和产业链行情的政经事实资讯。"

  raw-collection-v2:
    description: "独立纯采集：按原查询采集、算法去重并归档 MinIO；不调用模型、不提炼 Evidence，手动运行。"
    quick_prompts:
      - "采集全球范围最新发布、可能影响中国A股板块和产业链行情的政经事实资讯。"

  evidence-extraction:
    description: "仅供历史材料维护：读取旧 Raw Manifest。新采集在 Raw Collection 内直接提取并发布 Evidence，不再独立调度。"
    quick_prompts:
      - "处理所有尚未提取的 Raw Document"

  event-extraction:
    description: "批量提取 Event，四路 Parallel 按类型批量关联；Agent 直接配置为 Step，匹配后识别 Signal，冻结数据包再确定性发布。"
    quick_prompts:
      - "处理所有已发布且尚未提炼 Event 的 Evidence"

  investment-reasoning:
    description: "Schedule 直达的七阶段投研推理：冻结上下文，逐层分析并审核，生成报告后通过幂等发布适配器发布。"
    quick_prompts:
      - "获取最近48小时全部Event，分析对相关产业链所有节点的投资价值变化。"

  deployment-check:
    description: "检查 Tidewise AgentOS 的数据库、MCP、组件和调度配置。"
    quick_prompts:
      - "运行部署检查"
