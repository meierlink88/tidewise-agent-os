manifest:
  tidewise-assistant:
    description: "观潮家本地 AgentOS 助手，用于验证模型、会话与接口链路。"
    quick_prompts:
      - "请用一句话说明你是谁"
      - "当前本地 AgentOS 的用途是什么？"
      - "给我一个新增采集 Workflow 的实施顺序"

  raw-collector:
    description: "原始信息采集 Agent：自主组装查询并调用信息通道工具。生产采集请运行 Raw Collection Workflow。"
    quick_prompts:
      - "采集可能影响中国A股板块行情的最新政策资讯"
      - "采集上市公司重大订单和产能投放的最新消息"
      - "采集产业链供需与价格变化的最新资讯"

  local-ping:
    description: "不调用模型的本地运行时健康检查。"
    quick_prompts:
      - "Ping"

  raw-collection:
    description: "运行采集 Agent，并确定性生成和发布原始信息 Artifact。"
    quick_prompts:
      - "采集最近48小时可能影响中国A股板块和产业链行情的最新资讯，关注政策、供需、价格、重大订单、产能投放、技术突破和上市公司经营事件。"

  deployment-check:
    description: "检查 Tidewise AgentOS 的数据库、MCP、组件和调度配置。"
    quick_prompts:
      - "运行部署检查"
