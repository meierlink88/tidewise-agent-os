manifest:
  tidewise-assistant:
    description: "观潮家本地 AgentOS 助手，用于验证模型、会话与接口链路。"
    quick_prompts:
      - "请用一句话说明你是谁"
      - "当前本地 AgentOS 的用途是什么？"
      - "给我一个新增采集 Workflow 的实施顺序"

  title-curator:
    description: "Raw Evidence Filter：根据标题和摘要作出二元投研相关性判断；生产请运行 Raw Collection Workflow。"
    quick_prompts:
      - "判断这批标题是否具有A股投研价值"
      - "保留政策、产业和上市公司相关标题"
      - "过滤娱乐、体育和生活方式噪声标题"

  evidence-extractor:
    description: "一次阅读完成 Raw Evidence 唯一分类、语义补充和原子 Evidence 提取；生产处理请运行 Evidence Extraction Workflow。"
    quick_prompts:
      - "从给定目录选择唯一分类并提取原子 Evidence"
      - "按最小完整业务命题提炼 Evidence 的 summary、keywords 与 semantic"
      - "提炼这篇材料的关键词和可核验证据"

  event-extractor:
    description: "按主体、现实动作、直接对象、阶段和发生时点，将同批 Atomic Evidence 提炼为单一动作 Event Candidate。"
    quick_prompts:
      - "将这批 Evidence 提炼为 Event Candidate"
      - "识别同批 Evidence 中描述同一现实动作的内容"
      - "标记不能安全提炼 Event 的 Evidence"

  event-identity:
    description: "在冻结的历史 Event 候选集内判断原子性及 SAME、NEW、RELATED 或 IGNORED 身份。"
    quick_prompts:
      - "判断这个 Event Candidate 是否为单一现实动作"
      - "根据给定历史 Event 判断是否为同一事件"

  event-signal-analyst:
    description: "分类已投影的新 Event，并仅基于给定 Anchor 与 Variable 身份提出直接 Signal。"
    quick_prompts:
      - "分类这个 Event 并给出检索提示"
      - "基于给定候选身份提出直接 Signal"

  investment-reasoner:
    description: "按地缘政治、宏观经济、产业链三层复用推理，并从有效 Signal 根沿标准拓扑执行最多三跳传导。"
    quick_prompts:
      - "根据给定 Signal Fact 和拓扑推导产业链节点变化"

  investment-reviewer:
    description: "审核投研结论的 Signal 根、拓扑传导、周期和证据完整性。"
    quick_prompts:
      - "审核该产业链节点结论是否可追溯至有效 Signal Fact"

  local-ping:
    description: "不调用模型的本地运行时健康检查。"
    quick_prompts:
      - "Ping"

  raw-collection:
    description: "采集、过滤并发布最新 Raw Evidence Artifact。"
    quick_prompts:
      - "采集全球范围最新发布、可能影响中国A股板块和产业链行情的政经事实资讯。"

  evidence-extraction:
    description: "增量读取 Raw Collection Manifest 索引，冻结分类目录，并发布唯一分类的 Raw Evidence 和原子 Evidence。"
    quick_prompts:
      - "处理所有尚未提取的 Raw Document"

  event-extraction:
    description: "五阶段增量处理 Evidence：提炼、身份解析、发布 Event、分析 Signal、发布 Signal。"
    quick_prompts:
      - "处理所有已发布且尚未提炼 Event 的 Evidence"

  investment-reasoning:
    description: "Schedule 直达的五阶段投研推理：冻结Event/Signal，依次分析地缘政治、宏观经济、产业链及节点并审核。"
    quick_prompts:
      - "获取最近48小时全部Event，分析对相关产业链所有节点的投资价值变化。"

  deployment-check:
    description: "检查 Tidewise AgentOS 的数据库、MCP、组件和调度配置。"
    quick_prompts:
      - "运行部署检查"
