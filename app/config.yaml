manifest:
  tidewise-assistant:
    description: "观潮家本地 AgentOS 助手，用于验证模型、会话与接口链路。"
    quick_prompts:
      - "请用一句话说明你是谁"
      - "当前本地 AgentOS 的用途是什么？"
      - "给我一个新增采集 Workflow 的实施顺序"

  raw-collector:
    description: "Collection Query Planner：仅组装采集查询和回看时长，通道执行由 Raw Collection Workflow 确定性控制。"
    quick_prompts:
      - "采集可能影响中国A股板块行情的最新政策资讯"
      - "采集上市公司重大订单和产能投放的最新消息"
      - "采集产业链供需与价格变化的最新资讯"

  title-curator:
    description: "Collection Title Curator：仅根据标题作出二元投研相关性判断；生产请运行 Raw Collection Workflow。"
    quick_prompts:
      - "判断这批标题是否具有A股投研价值"
      - "保留政策、产业和上市公司相关标题"
      - "过滤娱乐、体育和生活方式噪声标题"

  evidence-extractor:
    description: "一次阅读完成 Raw Evidence 唯一分类、语义补充和原子 Evidence 提取；生产处理请运行 Evidence Extraction Workflow。"
    quick_prompts:
      - "从给定目录选择唯一分类并提取原子 Evidence"
      - "按 5W1H 提炼原子 Evidence 的 summary 与 semantic"
      - "提炼这篇材料的关键词和可核验证据"

  event-extractor:
    description: "按主体、现实动作、直接对象、阶段和发生时点，将同批 Atomic Evidence 提炼为单一动作 Event Candidate。"
    quick_prompts:
      - "将这批 Evidence 提炼为 Event Candidate"
      - "识别同批 Evidence 中描述同一现实动作的内容"
      - "标记不能安全提炼 Event 的 Evidence"

  investment-planner:
    description: "将 Schedule 中的自然语言投研命题解析为受限的分析时间窗、产业链数和传导跳数。"
    quick_prompts:
      - "分析最近48小时Event对A股产业链节点的投资价值影响"

  investment-reasoner:
    description: "从有效 Signal Fact 出发，沿标准产业链拓扑执行最多三跳传导并综合节点结论。"
    quick_prompts:
      - "根据给定 Signal Fact 和拓扑推导产业链节点变化"

  investment-reviewer:
    description: "审核投研结论的 Signal 根、拓扑传导、周期和证据完整性。"
    quick_prompts:
      - "审核该产业链节点结论是否可追溯至有效 Signal Fact"

  local-ping:
    description: "不调用模型的本地运行时健康检查。"
    quick_prompts:
      - "Ping"

  raw-collection:
    description: "运行采集 Agent，并确定性生成和发布原始信息 Artifact。"
    quick_prompts:
      - "采集最近48小时可能影响中国A股板块和产业链行情的最新资讯，关注政策、供需、价格、重大订单、产能投放、技术突破和上市公司经营事件。"

  evidence-extraction:
    description: "增量读取 Raw Collection Manifest 索引，冻结分类目录，并发布唯一分类的 Raw Evidence 和原子 Evidence。"
    quick_prompts:
      - "处理所有尚未提取的 Raw Document"

  event-extraction:
    description: "增量读取本地已映射 Evidence，提炼并去重 Event，投影 Graphiti 后构建变量信号。"
    quick_prompts:
      - "处理所有已发布且尚未提炼 Event 的 Evidence"

  investment-reasoning:
    description: "Schedule 驱动的五阶段投研推理：规划、冻结Graphiti上下文、Signal传导、结论综合和审核。"
    quick_prompts:
      - "获取最近48小时全部Event，分析对相关产业链所有节点的投资价值变化。"

  deployment-check:
    description: "检查 Tidewise AgentOS 的数据库、MCP、组件和调度配置。"
    quick_prompts:
      - "运行部署检查"
