# Join the existing Docker Desktop `local` project and shared Tidewise network.
# Start/stop this service by name; never run an unscoped `docker compose down`
# from this repository because other local services share the project label.
name: local

services:
  agentos:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-tidewise-agent-os}:${IMAGE_TAG:-latest}
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --reload-dir agents --reload-dir app --reload-dir capabilities --reload-dir db --reload-dir evals
      --reload-dir workflows
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - ${COLLECTOR_DATA_DIR:-./data}:/app/data
    env_file:
      - path: .env
        required: true
    environment:
      RUNTIME_ENV: dev
      AGNO_DEBUG: "True"
      WAIT_FOR_DB: "True"
      AGENTOS_URL: http://127.0.0.1:8000
      DB_HOST: postgres
      DB_PORT: 5432
    networks:
      - tidewise-local
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  tidewise-local:
    external: true
    name: tidewise-local
