# AgentOS owns this Docker Desktop project. PostgreSQL and Data Service remain
# reachable through the shared external `tidewise-local` network.
name: agent-os

services:
  neo4j:
    image: neo4j:5.26.28-community@sha256:ff32db30b2baff97971e441b46bfd9c832c1b62c970398ef579244c06b21d357
    container_name: agent-os-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:?NEO4J_USER is required}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - graphiti-neo4j-data:/data
      - graphiti-neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7474"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - tidewise-local

  agentos:
    container_name: agent-os
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-tidewise-agent-os}:${IMAGE_TAG:-latest}
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --reload-dir agents --reload-dir app --reload-dir capabilities --reload-dir db --reload-dir evals
      --reload-dir sematica --reload-dir workflows
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - ${COLLECTOR_DATA_DIR:-./data}:/app/data
    env_file:
      - path: .env
        required: true
    environment:
      RUNTIME_ENV: dev
      AGNO_DEBUG: "True"
      WAIT_FOR_DB: "True"
      AGENTOS_EXTERNAL_URL: http://127.0.0.1:8000
      AGENTOS_INTERNAL_URL: http://127.0.0.1:8000
      DB_HOST: postgres
      DB_PORT: 5432
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_HTTP_PORT: "7474"
      NEO4J_BOLT_PORT: "7687"
      DATA_SERVICE_BASE_URL: ${DATA_SERVICE_BASE_URL:-http://data:9011}
      DATA_SERVICE_TOKEN: ${DATA_SERVICE_TOKEN:-}
      EVIDENCE_ARTIFACT_ROOT: /app/data/evidence
      EVENT_ARTIFACT_ROOT: /app/data/event
      EVENT_EXTRACTION_BATCH_SIZE: ${EVENT_EXTRACTION_BATCH_SIZE:-50}
      REASON_SERVICE_BASE_URL: ${REASON_SERVICE_BASE_URL:-http://reason-graphiti-api:8890}
      REASON_SERVICE_TOKEN: ${REASON_SERVICE_TOKEN:-}
    networks:
      - tidewise-local
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  tidewise-local:
    external: true
    name: tidewise-local

volumes:
  graphiti-neo4j-data:
    external: true
    name: tidewise-reason_graphiti-neo4j-data
  graphiti-neo4j-logs:
    external: true
    name: tidewise-reason_graphiti-neo4j-logs
