# Production override for a host where the shared `tidewise-local` network and
# PostgreSQL service already exist. Production deployment topology should be
# reviewed before use; this file deliberately does not provision PostgreSQL.
services:
  agentos:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes: !override
      - ${COLLECTOR_DATA_DIR:-./data}:/app/data
    environment:
      RUNTIME_ENV: prd
      AGNO_DEBUG: "False"
      AGENTOS_URL: ${AGENTOS_URL:?Set AGENTOS_URL for production}
      MCP_CONNECT_SECRET: ${MCP_CONNECT_SECRET:-}
