[project]
name = "tidewise-agent-os"
version = "1.0.0"
description = "Tidewise self-hosted AgentOS runtime built on Agno."
requires-python = ">=3.12,<4"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Tidewise" }]

dependencies = [
  "agno[os,mcp,slack,pgvector,psycopg]==3.0.1",
  "graphiti-core==0.29.3",
  "httpx==0.28.1",
  "minio",
  "neo4j==6.2.0",
  "openai",
  "pydantic==2.13.4",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["mypy", "ruff"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "app*", "capabilities*", "db*", "evals*", "sematica*", "workflows*"]
namespaces = false

[tool.ruff]
line-length = 120
exclude = [".venv*", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = [".venv*", "sematica*"]
