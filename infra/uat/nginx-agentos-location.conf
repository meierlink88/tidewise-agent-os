location = /agentos {
    return 308 /agentos/;
}

location = /.well-known/oauth-authorization-server/agentos {
    proxy_pass http://127.0.0.1:9081/.well-known/oauth-authorization-server;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    add_header X-Tidewise-Upstream agentos-uat always;
}

location = /.well-known/oauth-protected-resource/agentos/mcp {
    proxy_pass http://127.0.0.1:9081/.well-known/oauth-protected-resource/agentos/mcp;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    add_header X-Tidewise-Upstream agentos-uat always;
}

location ^~ /agentos/ {
    proxy_pass http://127.0.0.1:9081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /agentos;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    add_header X-Tidewise-Upstream agentos-uat always;
}
