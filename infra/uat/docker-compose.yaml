name: tidewise-agentos-uat

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    restart: unless-stopped
    ports:
      - target: 5432
        published: ${POSTGRES_LAN_PORT:?POSTGRES_LAN_PORT is required}
        host_ip: ${UAT_LAN_BIND_ADDRESS:?UAT_LAN_BIND_ADDRESS is required}
        protocol: tcp
    environment:
      POSTGRES_USER: agent_os_uat_runtime
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS is required}
      POSTGRES_DB: agent_os_uat
    volumes:
      - agentos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_os_uat_runtime -d agent_os_uat"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging
    networks: [agentos-private]

  neo4j:
    image: ${NEO4J_IMAGE:?NEO4J_IMAGE is required}
    restart: unless-stopped
    ports:
      - target: 7474
        published: ${NEO4J_HTTP_LAN_PORT:?NEO4J_HTTP_LAN_PORT is required}
        host_ip: ${UAT_LAN_BIND_ADDRESS:?UAT_LAN_BIND_ADDRESS is required}
        protocol: tcp
      - target: 7687
        published: ${NEO4J_BOLT_LAN_PORT:?NEO4J_BOLT_LAN_PORT is required}
        host_ip: ${UAT_LAN_BIND_ADDRESS:?UAT_LAN_BIND_ADDRESS is required}
        protocol: tcp
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL_SIZE:-1G}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX_SIZE:-4G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-4G}
    volumes:
      - agentos-neo4j-data:/data
      - agentos-neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    logging: *default-logging
    networks: [agentos-private]

  agentos:
    image: ${AGENTOS_IMAGE:?AGENTOS_IMAGE is required}
    command: uvicorn app.main:app --host 0.0.0.0 --port 9081
    user: "10002:10002"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:9081:9081"
    volumes:
      - ${AGENTOS_DATA_DIR:-/opt/tidewise/agentos-uat/data}:/app/data
      - ${AGENTOS_JWKS_FILE:-/opt/tidewise/agentos-uat/jwt-jwks.json}:/run/secrets/agentos-jwks.json:ro
    environment:
      RUNTIME_ENV: prd
      AGNO_DEBUG: "False"
      WAIT_FOR_DB: "True"
      AGENTOS_RELEASE_SHA: ${RELEASE_SHA:?RELEASE_SHA is required}
      AGENTOS_EXTERNAL_URL: ${AGENTOS_EXTERNAL_URL:?AGENTOS_EXTERNAL_URL is required}
      AGENTOS_INTERNAL_URL: http://127.0.0.1:9081
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: agent_os_uat_runtime
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      DB_DATABASE: agent_os_uat
      DB_DRIVER: postgresql+psycopg
      DB_SSLMODE: disable
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_USE_THINKING: ${DEEPSEEK_USE_THINKING:-False}
      DATA_SERVICE_BASE_URL: ${DATA_SERVICE_BASE_URL:?DATA_SERVICE_BASE_URL is required}
      DATA_SERVICE_TOKEN: ${DATA_SERVICE_TOKEN:?DATA_SERVICE_TOKEN is required}
      COLLECTOR_ARTIFACT_ROOT: /app/data/collector
      EVIDENCE_ARTIFACT_ROOT: /app/data/evidence
      EVENT_ARTIFACT_ROOT: /app/data/event
      INVESTMENT_ARTIFACT_ROOT: /app/data/investment
      EVENT_EXTRACTION_BATCH_SIZE: ${EVENT_EXTRACTION_BATCH_SIZE:-20}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_HTTP_PORT: "7474"
      NEO4J_BOLT_PORT: "7687"
      GRAPHITI_EMBEDDING_API_KEY: ${GRAPHITI_EMBEDDING_API_KEY:?GRAPHITI_EMBEDDING_API_KEY is required}
      GRAPHITI_EMBEDDING_BASE_URL: ${GRAPHITI_EMBEDDING_BASE_URL:?GRAPHITI_EMBEDDING_BASE_URL is required}
      GRAPHITI_EMBEDDING_MODEL: ${GRAPHITI_EMBEDDING_MODEL:?GRAPHITI_EMBEDDING_MODEL is required}
      GRAPHITI_EMBEDDING_DIM: ${GRAPHITI_EMBEDDING_DIM:-1024}
      JWT_VERIFICATION_KEY: ${JWT_VERIFICATION_KEY:?JWT_VERIFICATION_KEY is required}
      JWT_JWKS_FILE: /run/secrets/agentos-jwks.json
      MCP_CONNECT_SECRET: ${MCP_CONNECT_SECRET:-}
      AGENTOS_MCP_SIGNING_KEY: ${AGENTOS_MCP_SIGNING_KEY:-}
      ENABLE_DEPLOY_CHECK: "False"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9081/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    logging: *default-logging
    networks: [agentos-private]

networks:
  agentos-private:
    name: tidewise-agentos-uat-private

volumes:
  agentos-postgres-data:
    name: tidewise-agentos-uat-postgres-data
  agentos-neo4j-data:
    name: tidewise-agentos-uat-neo4j-data
  agentos-neo4j-logs:
    name: tidewise-agentos-uat-neo4j-logs
